name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Run tests
        run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Publish test summary
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Vitest
          path: test-results/junit.xml
          reporter: java-junit

      - name: Save test summary
        if: always() && github.event_name == 'pull_request'
        run: cp "$GITHUB_STEP_SUMMARY" test-results/summary.md

      - name: Comment test results on the pull request
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: vitest
          path: test-results/summary.md
